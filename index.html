<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe: Hidden Stakes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a0a2e 50%, #16213e 100%);
            padding: 20px;
        }

        .container {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            border-radius: 24px;
            border: 2px solid #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3), inset 0 0 20px rgba(0, 255, 200, 0.1);
            padding: clamp(20px, 8vw, 50px);
            max-width: 90vw;
            width: 100%;
            max-width: 600px;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 8px;
            font-size: clamp(24px, 6vw, 40px);
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .subtitle {
            text-align: center;
            color: #00ccff;
            margin-bottom: 40px;
            font-size: clamp(12px, 2.5vw, 16px);
            font-weight: 500;
            opacity: 0.8;
        }

        .game-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(12px, 3vw, 20px);
            margin-bottom: clamp(25px, 5vw, 40px);
            text-align: center;
        }

        .info-box {
            padding: clamp(12px, 3vw, 18px);
            border-radius: 12px;
            background: linear-gradient(135deg, #0a0f2e 0%, #1a1a4e 100%);
            border: 1px solid #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        .info-label {
            font-size: clamp(10px, 2vw, 12px);
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: clamp(4px, 1.5vw, 8px);
            font-weight: 600;
            opacity: 0.7;
        }

        .current-player {
            font-size: clamp(20px, 5vw, 32px);
            font-weight: 700;
            color: #00ff88;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
        }

        .current-player.x {
            color: #00ffff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }

        .current-player.o {
            color: #ff00ff;
            text-shadow: 0 0 15px rgba(255, 0, 255, 0.6);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(8px, 2vw, 16px);
            margin-bottom: clamp(25px, 5vw, 40px);
            background: linear-gradient(135deg, #05051f 0%, #0a0a2e 100%);
            padding: clamp(12px, 3vw, 20px);
            border-radius: 16px;
            border: 1px solid #00ffff;
            box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.1);
        }

        .cell {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #0a0a20 0%, #151535 100%);
            border: 2px solid #00ccff;
            border-radius: clamp(8px, 2vw, 14px);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-height: clamp(60px, 18vw, 100px);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 204, 255, 0.2);
        }

        .cell:hover:not(.disabled) {
            background: linear-gradient(135deg, #1a1a40 0%, #2a2a60 100%);
            border-color: #00ff88;
            transform: translateY(-4px);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .cell.disabled {
            cursor: not-allowed;
            opacity: 0.5;
            background: linear-gradient(135deg, #050510 0%, #0a0a1a 100%);
        }

        .cell-piece {
            font-size: clamp(36px, 10vw, 60px);
            line-height: 1;
            margin-bottom: clamp(2px, 1vw, 6px);
            filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.5));
        }

        .cell-piece.x {
            color: #00ffff;
            filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.6));
        }

        .cell-piece.o {
            color: #ff00ff;
            filter: drop-shadow(0 0 10px rgba(255, 0, 255, 0.6));
        }

        .cell-value {
            font-size: clamp(10px, 2.5vw, 14px);
            color: #00ff88;
            font-weight: 600;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }

        .status {
            text-align: center;
            padding: clamp(12px, 3vw, 20px);
            margin-bottom: clamp(18px, 4vw, 28px);
            border-radius: 12px;
            font-weight: 600;
            display: none;
            min-height: 30px;
            font-size: clamp(14px, 3vw, 18px);
            animation: slideIn 0.3s ease-out;
        }

        .status.show {
            display: block;
        }

        .status.game-over {
            background: linear-gradient(135deg, #00ff88 0%, #00ccff 100%);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            font-weight: 700;
        }

        .status.draw {
            background: linear-gradient(135deg, #ff00ff 0%, #ff0088 100%);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: clamp(10px, 2vw, 16px);
            justify-content: center;
            margin-bottom: clamp(15px, 3vw, 25px);
            flex-wrap: wrap;
        }

        button {
            padding: clamp(10px, 2.5vw, 16px) clamp(20px, 5vw, 40px);
            font-size: clamp(13px, 2.5vw, 16px);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.3px;
            text-transform: uppercase;
            min-height: 44px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ff88 0%, #00ccff 100%);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            font-weight: 700;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6), 0 0 10px rgba(0, 255, 255, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(16px, 3vw, 24px);
            padding: clamp(16px, 4vw, 28px);
            background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 100%);
            border-radius: 14px;
            border: 1px solid #00ccff;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.2);
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: clamp(10px, 2vw, 12px);
            color: #00ffff;
            text-transform: uppercase;
            margin-bottom: clamp(6px, 1.5vw, 10px);
            font-weight: 600;
            letter-spacing: 1.2px;
            opacity: 0.7;
        }

        .stat-value {
            font-size: clamp(24px, 5.5vw, 36px);
            font-weight: 700;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .stat-value.x {
            color: #00ffff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .stat-value.o {
            color: #ff00ff;
            text-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
        }

        /* Extra small devices: 320px - 374px */
        @media (max-width: 374px) {
            body {
                padding: 12px;
            }

            .container {
                border-radius: 16px;
            }

            .cell:hover:not(.disabled) {
                transform: translateY(-2px);
            }

            button:hover {
                transform: translateY(-1px);
            }
        }

        /* Small devices: 375px - 599px */
        @media (max-width: 599px) {
            body {
                padding: 12px;
            }

            .cell:hover:not(.disabled) {
                transform: translateY(-3px);
            }

            button:hover {
                transform: translateY(-1px);
            }
        }

        /* Tablets: 600px - 899px */
        @media (min-width: 600px) and (max-width: 899px) {
            .container {
                max-width: 95vw;
            }
        }

        /* Large tablets and small desktops: 900px+ */
        @media (min-width: 900px) {
            body {
                padding: 40px;
            }

            .container {
                max-width: 600px;
            }
        }

        /* Touch device optimizations */
        @media (hover: none) and (pointer: coarse) {
            .cell {
                min-height: clamp(70px, 20vw, 110px);
            }

            button {
                min-height: 50px;
            }

            .cell:active:not(.disabled) {
                transform: scale(0.98);
            }

            button:active {
                transform: scale(0.95);
            }
        }

        /* Landscape orientation */
        @media (orientation: landscape) and (max-height: 600px) {
            .container {
                padding: clamp(15px, 4vw, 35px);
            }

            .game-info {
                margin-bottom: clamp(15px, 3vw, 25px);
            }

            .board {
                margin-bottom: clamp(15px, 3vw, 25px);
            }

            .subtitle {
                margin-bottom: clamp(15px, 3vw, 25px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 TicTacToe: Hidden Stakes</h1>
        <p class="subtitle">Where every move counts</p>

        <div class="game-info">
            <div class="info-box">
                <div class="info-label">Current Player</div>
                <div class="current-player x" id="currentPlayer">X</div>
            </div>
            <div class="info-box">
                <div class="info-label">Status</div>
                <div id="gameStatus" style="font-size: 14px; color: #00ffff; font-weight: 600;">Game in progress</div>
            </div>
        </div>

        <div class="status" id="statusMessage"></div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">X Points</div>
                <div class="stat-value x" id="scoreX">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">O Points</div>
                <div class="stat-value o" id="scoreO">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="newGameBtn">New Game</button>
        </div>
    </div>

    <script>
        class TicTacToe {
            constructor() {
                this.board = Array(9).fill(null);
                this.xPoints = 0;
                this.oPoints = 0;
                this.currentPlayer = 'X';
                this.gameOver = false;
                this.winner = null;
                this.init();
            }

            // Cell values: Center=3, Corners=2, Edges=1
            getCellValue(index) {
                const values = {
                    0: 2, 1: 1, 2: 2,  // Top row: corner, edge, corner
                    3: 1, 4: 3, 5: 1,  // Mid row: edge, center, edge
                    6: 2, 7: 1, 8: 2   // Bot row: corner, edge, corner
                };
                return values[index];
            }

            init() {
                this.setupEventListeners();
                this.render();
            }

            setupEventListeners() {
                document.querySelectorAll('.cell').forEach((cell, index) => {
                    cell.addEventListener('click', () => this.makeMove(index));
                });
                document.getElementById('newGameBtn').addEventListener('click', () => this.reset());
            }

            makeMove(index) {
                if (this.gameOver || this.board[index] !== null) return;

                this.board[index] = this.currentPlayer;

                // Claim the cell's value
                const cellValue = this.getCellValue(index);
                if (this.currentPlayer === 'X') {
                    this.xPoints += cellValue;
                } else {
                    this.oPoints += cellValue;
                }

                if (this.checkWin(this.currentPlayer)) {
                    this.gameOver = true;
                    this.winner = this.currentPlayer;
                } else if (this.isBoardFull()) {
                    this.gameOver = true;
                    this.determineWinner();
                } else {
                    this.currentPlayer = this.currentPlayer === 'X' ? 'O' : 'X';
                }

                this.render();
            }

            checkWin(player) {
                const winPatterns = [
                    [0, 1, 2], [3, 4, 5], [6, 7, 8],
                    [0, 3, 6], [1, 4, 7], [2, 5, 8],
                    [0, 4, 8], [2, 4, 6]
                ];

                return winPatterns.some(pattern =>
                    pattern.every(index => this.board[index] === player)
                );
            }

            isBoardFull() {
                return this.board.every(cell => cell !== null);
            }

            determineWinner() {
                // With odd total (15), ties are impossible
                if (this.xPoints > this.oPoints) {
                    this.winner = 'X-Points';
                } else {
                    this.winner = 'O-Points';
                }
            }

            render() {
                this.renderBoard();
                this.renderStatus();
                this.renderScores();
            }

            renderBoard() {
                document.querySelectorAll('.cell').forEach((cell, index) => {
                    cell.innerHTML = '';

                    if (this.board[index]) {
                        const pieceDiv = document.createElement('div');
                        pieceDiv.className = `cell-piece ${this.board[index].toLowerCase()}`;
                        pieceDiv.textContent = this.board[index];
                        cell.appendChild(pieceDiv);
                    }

                    const valueDiv = document.createElement('div');
                    valueDiv.className = 'cell-value';
                    valueDiv.textContent = `(${this.getCellValue(index)} pts)`;
                    cell.appendChild(valueDiv);

                    if (this.gameOver) {
                        cell.classList.add('disabled');
                    } else {
                        cell.classList.remove('disabled');
                    }
                });
            }

            renderStatus() {
                const currentPlayerEl = document.getElementById('currentPlayer');
                const gameStatusEl = document.getElementById('gameStatus');
                const statusMsgEl = document.getElementById('statusMessage');

                if (this.gameOver) {
                    currentPlayerEl.textContent = 'Game Over';
                    currentPlayerEl.className = 'current-player';

                    if (this.winner.includes('Points')) {
                        const player = this.winner.charAt(0);
                        const winnerPoints = player === 'X' ? this.xPoints : this.oPoints;
                        const loserPoints = player === 'X' ? this.oPoints : this.xPoints;
                        const diff = Math.abs(winnerPoints - loserPoints);
                        gameStatusEl.textContent = `${player} Wins by Points!`;
                        statusMsgEl.className = 'status show draw';
                        statusMsgEl.textContent = `🏆 ${player} wins by ${diff} point${diff !== 1 ? 's' : ''}!`;
                    } else {
                        gameStatusEl.textContent = `${this.winner} Wins!`;
                        statusMsgEl.className = 'status show game-over';
                        statusMsgEl.textContent = `🎉 Player ${this.winner} got three in a row!`;
                    }
                } else {
                    currentPlayerEl.textContent = this.currentPlayer;
                    currentPlayerEl.className = `current-player ${this.currentPlayer.toLowerCase()}`;
                    gameStatusEl.textContent = `${this.currentPlayer}'s Turn`;
                    statusMsgEl.classList.remove('show');
                }
            }

            renderScores() {
                document.getElementById('scoreX').textContent = this.xPoints;
                document.getElementById('scoreO').textContent = this.oPoints;
            }

            reset() {
                this.board = Array(9).fill(null);
                this.xPoints = 0;
                this.oPoints = 0;
                this.currentPlayer = 'X';
                this.gameOver = false;
                this.winner = null;
                this.render();
            }
        }

        const game = new TicTacToe();
    </script>
</body>
</html>
