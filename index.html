<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe: Hidden Stakes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 5px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .game-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .info-box {
            padding: 15px;
            border-radius: 10px;
            background: #f5f5f5;
        }

        .info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .current-player {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .current-player.x {
            color: #3498db;
        }

        .current-player.o {
            color: #e74c3c;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 10px;
        }

        .cell {
            aspect-ratio: 1;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            position: relative;
            min-height: 100px;
            font-weight: bold;
        }

        .cell:hover:not(.disabled) {
            background: #f9f9f9;
            border-color: #667eea;
            transform: scale(1.02);
        }

        .cell.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .cell-piece {
            font-size: 48px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .cell-piece.x {
            color: #3498db;
        }

        .cell-piece.o {
            color: #e74c3c;
        }

        .cell-value {
            font-size: 16px;
            color: #999;
            font-weight: 600;
        }

        .status {
            text-align: center;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
            min-height: 30px;
        }

        .status.show {
            display: block;
        }

        .status.game-over {
            background: #2ecc71;
            color: white;
        }

        .status.draw {
            background: #f39c12;
            color: white;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }

        .stat-value.x {
            color: #3498db;
        }

        .stat-value.o {
            color: #e74c3c;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .cell {
                min-height: 80px;
            }

            .cell-piece {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 TicTacToe: Hidden Stakes</h1>
        <p class="subtitle">Where every move counts</p>

        <div class="game-info">
            <div class="info-box">
                <div class="info-label">Current Player</div>
                <div class="current-player x" id="currentPlayer">X</div>
            </div>
            <div class="info-box">
                <div class="info-label">Status</div>
                <div id="gameStatus" style="font-size: 14px; color: #666;">Game in progress</div>
            </div>
        </div>

        <div class="status" id="statusMessage"></div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">X Points</div>
                <div class="stat-value x" id="scoreX">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">O Points</div>
                <div class="stat-value o" id="scoreO">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="newGameBtn">New Game</button>
        </div>
    </div>

    <script>
        class TicTacToe {
            constructor() {
                this.board = Array(9).fill(null);
                this.xPoints = 0;
                this.oPoints = 0;
                this.currentPlayer = 'X';
                this.gameOver = false;
                this.winner = null;
                this.init();
            }

            // Cell values: Center=3, Corners=2, Edges=1
            getCellValue(index) {
                const values = {
                    0: 2, 1: 1, 2: 2,  // Top row: corner, edge, corner
                    3: 1, 4: 3, 5: 1,  // Mid row: edge, center, edge
                    6: 2, 7: 1, 8: 2   // Bot row: corner, edge, corner
                };
                return values[index];
            }

            init() {
                this.setupEventListeners();
                this.render();
            }

            setupEventListeners() {
                document.querySelectorAll('.cell').forEach((cell, index) => {
                    cell.addEventListener('click', () => this.makeMove(index));
                });
                document.getElementById('newGameBtn').addEventListener('click', () => this.reset());
            }

            makeMove(index) {
                if (this.gameOver || this.board[index] !== null) return;

                this.board[index] = this.currentPlayer;

                // Claim the cell's value
                const cellValue = this.getCellValue(index);
                if (this.currentPlayer === 'X') {
                    this.xPoints += cellValue;
                } else {
                    this.oPoints += cellValue;
                }

                if (this.checkWin(this.currentPlayer)) {
                    this.gameOver = true;
                    this.winner = this.currentPlayer;
                } else if (this.isBoardFull()) {
                    this.gameOver = true;
                    this.determineWinner();
                } else {
                    this.currentPlayer = this.currentPlayer === 'X' ? 'O' : 'X';
                }

                this.render();
            }

            checkWin(player) {
                const winPatterns = [
                    [0, 1, 2], [3, 4, 5], [6, 7, 8],
                    [0, 3, 6], [1, 4, 7], [2, 5, 8],
                    [0, 4, 8], [2, 4, 6]
                ];

                return winPatterns.some(pattern =>
                    pattern.every(index => this.board[index] === player)
                );
            }

            isBoardFull() {
                return this.board.every(cell => cell !== null);
            }

            determineWinner() {
                // With odd total (15), ties are impossible
                if (this.xPoints > this.oPoints) {
                    this.winner = 'X-Points';
                } else {
                    this.winner = 'O-Points';
                }
            }

            render() {
                this.renderBoard();
                this.renderStatus();
                this.renderScores();
            }

            renderBoard() {
                document.querySelectorAll('.cell').forEach((cell, index) => {
                    cell.innerHTML = '';

                    if (this.board[index]) {
                        const pieceDiv = document.createElement('div');
                        pieceDiv.className = `cell-piece ${this.board[index].toLowerCase()}`;
                        pieceDiv.textContent = this.board[index];
                        cell.appendChild(pieceDiv);
                    }

                    const valueDiv = document.createElement('div');
                    valueDiv.className = 'cell-value';
                    valueDiv.textContent = `(${this.getCellValue(index)} pts)`;
                    cell.appendChild(valueDiv);

                    if (this.gameOver) {
                        cell.classList.add('disabled');
                    } else {
                        cell.classList.remove('disabled');
                    }
                });
            }

            renderStatus() {
                const currentPlayerEl = document.getElementById('currentPlayer');
                const gameStatusEl = document.getElementById('gameStatus');
                const statusMsgEl = document.getElementById('statusMessage');

                if (this.gameOver) {
                    currentPlayerEl.textContent = 'Game Over';
                    currentPlayerEl.className = 'current-player';

                    if (this.winner.includes('Points')) {
                        const player = this.winner.charAt(0);
                        const winnerPoints = player === 'X' ? this.xPoints : this.oPoints;
                        const loserPoints = player === 'X' ? this.oPoints : this.xPoints;
                        gameStatusEl.textContent = `${player} Wins by Points!`;
                        statusMsgEl.className = 'status show draw';
                        statusMsgEl.textContent = `🏆 ${player} wins ${winnerPoints} vs ${loserPoints} points!`;
                    } else {
                        gameStatusEl.textContent = `${this.winner} Wins!`;
                        statusMsgEl.className = 'status show game-over';
                        statusMsgEl.textContent = `🎉 Player ${this.winner} got three in a row!`;
                    }
                } else {
                    currentPlayerEl.textContent = this.currentPlayer;
                    currentPlayerEl.className = `current-player ${this.currentPlayer.toLowerCase()}`;
                    gameStatusEl.textContent = `${this.currentPlayer}'s Turn`;
                    statusMsgEl.classList.remove('show');
                }
            }

            renderScores() {
                document.getElementById('scoreX').textContent = this.xPoints;
                document.getElementById('scoreO').textContent = this.oPoints;
            }

            reset() {
                this.board = Array(9).fill(null);
                this.xPoints = 0;
                this.oPoints = 0;
                this.currentPlayer = 'X';
                this.gameOver = false;
                this.winner = null;
                this.render();
            }
        }

        const game = new TicTacToe();
    </script>
</body>
</html>
